name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruff:
    name: Ruff check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3

  testes-back-end:
    name: Testes do back-end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back-end

    # Postgres descartável, só para os testes (as credenciais "ci" existem
    # apenas dentro deste runner e somem quando o job termina).
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: caderno_digital_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/caderno_digital_test?schema=public
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/caderno_digital_test?schema=public
      JWT_SECRET: segredo-apenas-para-ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: back-end/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Verificar tipos (TypeScript)
        run: npx tsc --noEmit

      - name: Aplicar migrations no banco de teste
        run: npx prisma migrate deploy

      - name: Rodar testes
        run: npm test
